<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>Checker</title></head>
<body>
  <header><span class="mark">✓</span><strong>CHECKER</strong><span class="caption" data-i18n="나중에 챙길 일"></span></header>
  <main>
    <h1 data-i18n="지금 이 화면, 챙겨두기"></h1>
    <p class="intro" data-i18n="AI가 내용을 읽고 해야 할 일과 카테고리를 알아서 정리해요."></p>
    <div id="page" class="page"></div>
    <section id="preview" hidden><span id="result-category" class="category"></span><h2 id="result-title"></h2><p id="result-note"></p></section>
    <p id="result" role="status" aria-live="polite"></p>
    <button id="save" type="button" disabled><span id="spinner" hidden aria-hidden="true"></span><span id="button-label"></span></button>
    <p class="disclosure" data-i18n="화면 이미지와 페이지 내용을 로그인된 Codex 계정으로 보내 분석합니다."></p>
    <div class="language-picker"><label for="language" data-i18n="언어"></label><select id="language"><option value="en">English</option><option value="ko">한국어</option></select></div>
  </main>
  <script src="strings.js"></script><script src="i18n.js"></script><script src="popup.js"></script>
</body></html>
